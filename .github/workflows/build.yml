name: Build

on:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      build_type:
        description: 'CMake build type'
        required: false
        default: 'Release'
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # -------------------------------------------------------------------------
  #  x86_64 -- MSYS2 MINGW64, native GCC toolchain.
  # -------------------------------------------------------------------------
  build-x64:
    name: x64 (MinGW-w64 / GCC)
    runs-on: windows-latest
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-zlib

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Verify import table
        run: |
          set -e
          OBJDUMP="$(command -v llvm-objdump || command -v objdump)"
          echo "Using: $OBJDUMP"
          echo "--- Import table ---"
          "$OBJDUMP" -p build/privedit_gui.exe | grep -i "dll name" || true
          if "$OBJDUMP" -p build/privedit_gui.exe | grep -iE "libsodium|libcrypto|zlib1|libgcc|libstdc"; then
            echo "ERROR: found non-system DLL dependency"
            exit 1
          fi
          echo "OK: only Windows system DLLs are referenced"

      - uses: actions/upload-artifact@v4
        with:
          name: privedit-gui-x64
          path: build/privedit_gui.exe
          if-no-files-found: error
          compression-level: 9

  # -------------------------------------------------------------------------
  #  ARM64 -- MSYS2 CLANGARM64, native Clang toolchain.
  # -------------------------------------------------------------------------
  build-arm64:
    name: ARM64 (Clang / CLANGARM64)
    runs-on: windows-11-arm
    if: >
      github.event_name != 'pull_request' ||
      github.event.pull_request.draft == false
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: false
          install: >-
            mingw-w64-clang-aarch64-clang
            mingw-w64-clang-aarch64-cmake
            mingw-w64-clang-aarch64-ninja
            mingw-w64-clang-aarch64-pkgconf
            mingw-w64-clang-aarch64-libsodium
            mingw-w64-clang-aarch64-zlib

      # CLANGARM64 ships LLVM tools, not GNU binutils. Provide a windres
      # shim so CMake's RC step works. Prefer llvm-windres if present,
      # else fall back to llvm-rc (which enters windres-compatible mode
      # when invoked as `windres`).
      - name: Provide windres for ARM64
        run: |
          set -e
          if command -v windres >/dev/null 2>&1; then
            echo "windres found: $(command -v windres)"
          elif command -v llvm-windres >/dev/null 2>&1; then
            ln -sf "$(command -v llvm-windres)" /clangarm64/bin/windres.exe
            echo "Linked windres -> llvm-windres"
          elif command -v llvm-rc >/dev/null 2>&1; then
            ln -sf "$(command -v llvm-rc)" /clangarm64/bin/windres.exe
            echo "Linked windres -> llvm-rc (windres compat mode)"
          else
            echo "ERROR: no resource compiler available in CLANGARM64"
            exit 1
          fi

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=${{ github.event.inputs.build_type || 'Release' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Verify import table
        run: |
          set -e
          OBJDUMP="$(command -v llvm-objdump || command -v objdump)"
          echo "Using: $OBJDUMP"
          echo "--- Import table ---"
          "$OBJDUMP" -p build/privedit_gui.exe | grep -i "dll name" || true
          if "$OBJDUMP" -p build/privedit_gui.exe | grep -iE "libsodium|libcrypto|zlib1|libgcc|libstdc"; then
            echo "ERROR: found non-system DLL dependency"
            exit 1
          fi
          echo "OK: only Windows system DLLs are referenced"

      - uses: actions/upload-artifact@v4
        with:
          name: privedit-gui-arm64
          path: build/privedit_gui.exe
          if-no-files-found: error
          compression-level: 9